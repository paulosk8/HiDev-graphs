<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PedagoGraph">
  <title>PedagoGraph</title>
  <!--
    Marca de PedagoGraph: un birrete académico dibujado como un grafo — las
    cuatro esquinas son nodos y los lados, aristas. Une de un vistazo las dos
    ideas de la app: docencia y conocimiento conectado.
    Un solo color (índigo #4f46e5) para que funcione a 16 px y en monocromo.
  -->
  <g fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Borla: cuelga de la esquina derecha del birrete -->
    <path d="M57 25 V46" stroke-width="3.5" />
    <!-- Birrete: el rombo visto en perspectiva -->
    <path d="M32 14 L57 25 L32 36 L7 25 Z" fill="#4f46e5" fill-opacity=".12" />
  </g>
  <g fill="#4f46e5">
    <circle cx="32" cy="14" r="4.5" />
    <circle cx="57" cy="25" r="4.5" />
    <circle cx="32" cy="36" r="4.5" />
    <circle cx="7" cy="25" r="4.5" />
    <circle cx="57" cy="50" r="4" />
  </g>
</svg>
